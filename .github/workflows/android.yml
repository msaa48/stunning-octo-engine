name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bundled = الموقع جوه التطبيق | live = التطبيق بيفتح نسخة الموقع الحالية"
        type: choice
        options: [bundled, live]
        default: bundled
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MASAR_MODE: ${{ inputs.mode || 'bundled' }}
      MASAR_LIVE_URL: https://msaa48.github.io/stunning-octo-engine/
      APP_ID: com.masar.centers
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare www + capacitor config
        run: node scripts/prepare.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons
        run: npx capacitor-assets generate --android

      - name: Sync web assets + plugins
        run: npx cap sync android

      - name: Set version (versionCode = run number)
        run: |
          VC=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"1.0.$VC\"/" android/app/build.gradle
          grep -nE "versionCode|versionName|applicationId|minSdk|targetSdk" android/app/build.gradle android/variables.gradle || true

      - name: Build release APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align + sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNS=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          [ -n "$UNS" ] || { echo "unsigned apk not found"; find android/app/build/outputs -name "*.apk"; exit 1; }
          if [ -z "$KS_B64" ]; then
            echo "::warning::no keystore secret - using a temporary key (updates will not install over earlier builds)"
            KS_PASS=temporary-pass; KS_ALIAS=tmp
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/ks.p12" -alias tmp -keyalg RSA -keysize 2048 -validity 3650 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=tmp"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          fi
          export KS_PASS
          "$BT/zipalign" -p -f 4 "$UNS" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out masar.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs masar.apk | head -3
          ls -la masar.apk

      - name: Publish release (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create apk-latest masar.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "مسار - APK (آخر نسخة)" \
            --notes "نسخة رقم ${{ github.run_number }} | الوضع: $MASAR_MODE | commit ${GITHUB_SHA::7}"
