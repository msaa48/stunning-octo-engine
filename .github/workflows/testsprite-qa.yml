name: QA آلي - Playwright + Groq Auto-Fix (مجاني بالكامل)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html"]
  schedule:
    - cron: "0 3 * * 0"   # مرة أسبوعيًا (الأحد 3ص UTC) بدل يومي، توفيرًا للوقت

jobs:
  qa-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEPLOYED_URL: "https://msaa48.github.io/stunning-octo-engine/"
      MAX_FIX_ROUNDS: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + browsers
        run: |
          npm init -y > /dev/null 2>&1 || true
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run QA + Auto-Fix loop
        run: |
          pip install requests --break-system-packages --quiet
          python3 qa_autofix.py

      - name: Upload test report (لو فشل)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
