<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مسار — إدارة سناتر تعليمية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap');
  :root{
    --teacher-1:#c2673a; --teacher-2:#d98456;
    --parent-1:#1e6b7a; --parent-2:#2c8a9c;
    --admin-1:#4a3d7a; --admin-2:#6553a0;
    --bg:#faf7f0; --card:#ffffff; --text:#1c2b45; --muted:#7a7466;
    --border:#e8e0d0; --success:#3d8a5f; --danger:#c0433a; --warn:#c2873a;
    --ink:#1c2b45; --paper:#faf7f0; --gold:#c9a45c;
    --shadow-1:var(--shadow-1); --shadow-2:var(--shadow-2); --shadow-3:var(--shadow-3);
    --modal-scrim:rgba(28,43,69,.45); --input-bg:#ffffff; --cancel-bg:#f0ead9;
    --tint-warm:#fbeee5; --tint-pending-bg:#fbeed1; --tint-pending-fg:#93610f;
    --tint-resolved-bg:#dcefe1; --tint-resolved-fg:#1e6b3d;
    color-scheme: light;
    transition: background-color .4s cubic-bezier(.22,1,.36,1), color .4s cubic-bezier(.22,1,.36,1);
  }
  [data-theme="dark"]{
    --bg:#12182a; --card:#1a2138; --text:#eae6da; --muted:#9691a3;
    --border:#2b3350; --ink:#f2eee2; --paper:#0e1424; --gold:#e0b96e;
    --teacher-1:#d98456; --teacher-2:#e6a274;
    --parent-1:#2c8a9c; --parent-2:#48aebd;
    --admin-1:#6553a0; --admin-2:#8272c2;
    --success:#4fa876; --danger:#dd6e63; --warn:#dba55c;
    --shadow-1:rgba(0,0,0,.25); --shadow-2:rgba(0,0,0,.4); --shadow-3:rgba(0,0,0,.55);
    --modal-scrim:rgba(6,9,18,.65); --input-bg:#20283f; --cancel-bg:#242c46;
    --tint-warm:#3a2c26; --tint-pending-bg:#3d331a; --tint-pending-fg:#e0b96e;
    --tint-resolved-bg:#1c3527; --tint-resolved-fg:#6fc794;
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition: background-color .4s cubic-bezier(.22,1,.36,1), color .4s cubic-bezier(.22,1,.36,1);}
  h1,h2,h3,.title,.brand h1{font-family:'Cairo', 'Tajawal', sans-serif;}

  .theme-toggle{position:fixed; top:16px; right:16px; z-index:60; width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; box-shadow:0 4px 14px var(--shadow-2); transition: transform .3s cubic-bezier(.34,1.56,.64,1), background .3s ease, box-shadow .3s ease;}
  .theme-toggle:active{transform:scale(.88) rotate(-12deg);}
  .theme-toggle .icon{display:inline-block; transition: transform .5s cubic-bezier(.22,1,.36,1), opacity .3s ease;}
  .screen{min-height:100vh; display:none; flex-direction:column;}
  .screen.active{display:flex;}
  .container{max-width:480px; margin:0 auto; width:100%; padding:20px; flex:1;}
  #login-screen{justify-content:center; position:relative; overflow:hidden; background:
    radial-gradient(circle at 15% 8%, rgba(201,164,92,.10), transparent 40%),
    radial-gradient(circle at 90% 88%, rgba(30,107,122,.08), transparent 45%),
    var(--paper);
  }
  .brand{text-align:center; margin-bottom:34px; position:relative;}
  .brand .eyebrow{display:inline-block; font-size:11px; letter-spacing:.14em; color:var(--gold); font-weight:700; text-transform:uppercase; margin-bottom:10px;}
  .brand h1{font-size:34px; margin:0 0 6px; font-weight:800; color:var(--ink); letter-spacing:-.01em;}
  .brand h1 .mark{color:var(--gold); font-size:.6em; vertical-align:middle;}
  .brand p{color:var(--muted); margin:0; font-size:13.5px;}
  .brand .rule{width:44px; height:3px; background:var(--gold); border-radius:2px; margin:14px auto 0;}
  .deco-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .deco-shape{ position:absolute; color:var(--gold); opacity:.12; }
  [data-theme="dark"] .deco-shape{ opacity:.10; }
  .deco-1{ width:220px; height:220px; top:-60px; right:-70px; animation: decoSpin 60s linear infinite, decoDrift1 14s var(--ease-in-out) infinite; }
  .deco-2{ width:280px; height:280px; bottom:-40px; left:-60px; color:var(--parent-1); opacity:.10; animation: decoDrift2 16s var(--ease-in-out) infinite; }
  .deco-3{ width:60px; height:60px; top:14%; left:8%; color:var(--gold); opacity:.16; animation: decoSpin 40s linear infinite reverse, decoFloat 7s var(--ease-in-out) infinite; }
  .deco-4{ width:110px; height:110px; bottom:16%; right:6%; color:var(--admin-1); opacity:.10; animation: decoSpin 50s linear infinite, decoFloat 9s var(--ease-in-out) infinite .5s; }
  .deco-dot{ position:absolute; border-radius:50%; background:var(--gold); opacity:.35; }
  .deco-dot-1{ width:8px; height:8px; top:22%; right:18%; animation: decoFloat 5.5s var(--ease-in-out) infinite; }
  .deco-dot-2{ width:5px; height:5px; bottom:28%; left:16%; background:var(--parent-1); animation: decoFloat 6.5s var(--ease-in-out) infinite .8s; }
  .deco-dot-3{ width:6px; height:6px; top:62%; right:10%; background:var(--admin-1); animation: decoFloat 7.5s var(--ease-in-out) infinite 1.4s; }
  @keyframes decoSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes decoFloat{ 0%,100%{ transform:translateY(0) translateX(0); } 50%{ transform:translateY(-14px) translateX(6px); } }
  @keyframes decoDrift1{ 0%,100%{ transform:translate(0,0) rotate(0deg); } 50%{ transform:translate(-10px,12px) rotate(8deg); } }
  @keyframes decoDrift2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(12px,-10px); } }
  .student-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;}
  .student-card{background:var(--card-bg,#fff); border:2px solid var(--border); border-radius:14px; padding:10px; text-align:center; cursor:pointer; transition:.15s;}
  .student-card.active{border-color:var(--teacher-1,#c2673a); box-shadow:0 4px 14px var(--shadow-1);}
  .student-card .sc-photo{width:56px; height:56px; border-radius:50%; margin:0 auto 6px; background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden; position:relative;}
  .student-card .sc-photo img{width:100%; height:100%; object-fit:cover;}
  .student-card .sc-photo input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .student-card .sc-name{font-weight:700; font-size:14px; font-family:'Cairo',sans-serif; margin-bottom:2px;}
  .student-card .sc-sub{font-size:11px; color:var(--muted);}
  .login-form{display:flex; flex-direction:column; gap:12px; margin-top:20px;}
  .login-form input{padding:10px; border:1px solid var(--border); border-radius:6px; background:var(--input-bg); color:var(--text);}
  .login-form button{padding:10px; background:var(--teacher-1); color:#fff; border:none; border-radius:6px; cursor:pointer;}
  .pw-eye{position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:18px; color:var(--muted);}
  .password-wrapper{position:relative;}
</style>
</head>
<body>

<!-- Theme toggle button -->
<div class="theme-toggle" aria-label="تبديل الوضع الليلي">
  <span class="icon">🌙</span>
</div>

<!-- Login Screen -->
<div id="login-screen" class="screen active">
  <div class="container">
    <div class="brand">
      <
